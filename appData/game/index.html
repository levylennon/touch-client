<!DOCTYPE HTML>
<html lang="fr">
    <head>
        <script>
       
        // Touch fix
        window.ontouchstart = function(e) {};

        // Init - simplified for web-only version
        window.buildVersion = "web";
        window.appVersion = "web";
        window.appInfo = {
            version: "web"
        };

        window._ = {
            appVersion: "web",
            buildVersion: "web",
            client: "android"
        };

        window.indexedDB = {};
        window.IDBDatabase = {};
        window.IDBTransaction = {};
        window.IDBCursor = {};
        window.IDBKeyRange = {};

        window.cordova = {
            plugins: {
                isemulator: {
                    assess: function(fct) {
                        fct(false);
                    }
                },
                Keyboard: {
                    close: function() {},
                    disableScroll: function() {},
                    show: function() {},
                    hideKeyboardAccessoryBar: function() {}
                },
                notification: {
                    local: false
                },
                pushNotification: {
                    onDeviceReady: function() {},
                    setUserId: function() {},
                    registerDevice: function() {}
                }
            }
        };
        
        // Platform detection - detect Android/Capacitor
        var platform = "web";
        var isAndroid = false;
        var isCapacitor = false;
        
        // Detect Capacitor/Android
        if (window.Capacitor || (window.android && window.android.webview)) {
            isCapacitor = true;
            isAndroid = true;
            platform = "android";
            console.log('[DOFUS] Running on Android/Capacitor');
        } else if (window.top.platform) {
            platform = window.top.platform;
        }
        
        console.log('[DOFUS] Platform detected:', platform);
        console.log('[DOFUS] Is Android:', isAndroid);
        console.log('[DOFUS] Is Capacitor:', isCapacitor);
        
        if (platform == "darwin") {
            (function() {
                window.requestAnimationFrame = function(callback) {
                    var self = requestAnimationFrame;
                    self.queue.push(callback);
                    if (!self.timeout) {
                        self.timeout = setTimeout(function() {
                            var queue = self.queue;
                            self.queue = [];
                            self.timeout = null;
                            queue.forEach(function(q) {
                                q();
                            });
                        }, 16);
                    }
                };
                requestAnimationFrame.queue   = [];
                requestAnimationFrame.timeout = null;
            })();
        }

        // Configuration: Set to false to disable proxy and use direct CORS requests
        // Set to true to use proxy (default, recommended if CORS is not properly configured)
        // On Android, proxy is not available, so we use direct CORS if server supports it
        var USE_PROXY = false;
        
        // Log configuration
        console.log('[DOFUS] USE_PROXY:', USE_PROXY);
        console.log('[DOFUS] Current origin:', window.location.origin);

        
        window.initDofus = function(cb) {
            console.log('[DOFUS] Initializing game...');
            if (typeof updateStatus === 'function') {
                updateStatus('Inicializando jogo...');
            }
            var head = document.getElementsByTagName('head')[0];

            var scriptScript = document.createElement('script');
            
            scriptScript.addEventListener('load', function() {
                console.log('[DOFUS] Main script loaded successfully');
                updateStatus('Script principal carregado');
                var fixesScript = document.createElement('script');
                fixesScript.addEventListener('load', function() {
                    console.log('[DOFUS] Fixes script loaded successfully');
                    updateStatus('Jogo inicializado');
                    if (cb) cb();
                });
                fixesScript.addEventListener('error', function(e) {
                    console.error('[DOFUS] Error loading fixes.js:', e);
                    updateStatus('Erro ao carregar fixes.js');
                    if (cb) cb();
                });
                fixesScript.src = 'fixes.js';
                head.appendChild(fixesScript);
            });
            
            scriptScript.addEventListener('error', function(e) {
                console.error('[DOFUS] Error loading build/script.js:', e);
                console.error('[DOFUS] Script path attempted:', scriptScript.src);
                console.error('[DOFUS] Current location:', window.location.href);
                if (typeof updateStatus === 'function') {
                    updateStatus('ERRO: Não foi possível carregar build/script.js');
                }
                alert('Erro ao carregar o jogo. Verifique o console para mais detalhes.');
                if (cb) cb();
            });
            
            scriptScript.src = 'build/script.js';
            console.log('[DOFUS] Loading script from:', scriptScript.src);
            head.appendChild(scriptScript);
        };
        
        // Log page load state
        console.log('[DOFUS] Document ready state:', document.readyState);
        console.log('[DOFUS] Document location:', window.location.href);
        
        // Auto-initialize game when page loads (for web-only version)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                console.log('[DOFUS] DOMContentLoaded fired');
                window.initDofus(function() {
                    console.log('[DOFUS] Game initialization complete');
                });
            });
        } else {
            console.log('[DOFUS] Document already loaded, initializing immediately');
            window.initDofus(function() {
                console.log('[DOFUS] Game initialization complete');
            });
        }
        
        // Log any errors
        window.addEventListener('error', function(e) {
            console.error('[DOFUS] Global error:', e.message, e.filename, e.lineno);
        });
        
        window.addEventListener('unhandledrejection', function(e) {
            console.error('[DOFUS] Unhandled promise rejection:', e.reason);
        });
        
    </script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <link rel="stylesheet" href="build/styles-native.css" />
        <link rel="stylesheet" href="fixes.css" />
    </head>
    <body>
        <div id="loading-indicator" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Arial, sans-serif; z-index: 9999;">
            <div style="font-size: 18px; margin-bottom: 20px;">Carregando Dofus Touch...</div>
            <div id="loading-status" style="font-size: 14px; color: #888;">Inicializando...</div>
        </div>
        <script>
            // Update loading status
            var loadingStatus = document.getElementById('loading-status');
            function updateStatus(text) {
                if (loadingStatus) {
                    loadingStatus.textContent = text;
                    console.log('[DOFUS] Status:', text);
                }
            }
            
            // Hide loading indicator when game loads
            window.addEventListener('load', function() {
                setTimeout(function() {
                    var indicator = document.getElementById('loading-indicator');
                    if (indicator) {
                        indicator.style.display = 'none';
                    }
                }, 2000);
            });
            
            updateStatus('Página carregada');
        </script>
    </body>
    <!-- Dependencies -->
    <script src="keymaster2.js"></script>
</html>
